# Environnement de test manuel — sert le build comme en préproduction.
# Usage :
#   npm run build:test
#   docker compose -f docker-compose.test.yml up -d
#   open http://localhost:4173

services:
  hublot-test:
    image: nginx:alpine
    container_name: hublot-test-preview
    ports:
      - "4173:80"
    volumes:
      - ./build:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: "no"
